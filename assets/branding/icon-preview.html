<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reel Mind Icon Concepts</title>
    <style>
      body {
        margin: 0;
        padding: 40px;
        font-family: Arial, sans-serif;
        background: #f7f4ee;
        color: #152033;
      }
      h1 {
        margin: 0 0 24px;
        font-size: 32px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 24px;
      }
      .card {
        background: white;
        border-radius: 24px;
        padding: 20px;
        box-shadow: 0 16px 32px rgba(18, 32, 51, 0.08);
      }
      img {
        width: 100%;
        border-radius: 24px;
        display: block;
        background: #fff;
      }
      h2 {
        margin: 16px 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0;
        color: #5e6a7d;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>Reel Mind Icon Concepts</h1>
    <div class="grid">
      <div class="card">
        <img src="./reel-mind-icon-orbit.svg" alt="Orbit concept" />
        <h2>Orbit</h2>
        <p>Film-reel inspired circle with an energetic spark for AI-assisted creativity.</p>
      </div>
      <div class="card">
        <img src="./reel-mind-icon-monogram.svg" alt="Monogram concept" />
        <h2>Monogram</h2>
        <p>Premium RM monogram icon for a polished, founder-friendly brand feel.</p>
      </div>
      <div class="card">
        <img src="./reel-mind-icon-playwave.svg" alt="Playwave concept" />
        <h2>Playwave</h2>
        <p>Play button plus wave lines to suggest voice, video rhythm, and content flow.</p>
      </div>
    </div>
  </body>
</html>
